<!DOCTYPE html>
<html lang="en">

<head>
    <title>TV-SERIES</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.15.4/css/all.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PTGKS1F95Z"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-PTGKS1F95Z');
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1014;
            --card-bg: #1a1c23;
            --accent: #00d2ff;
            --accent-glow: #3a7bd5;
            --text-main: #f0f0f0;
            --text-muted: #a0a0a0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
        }

        /* Top Banner */
        .top-banner {
            background: linear-gradient(135deg, #0b0c10 0%, #1a1c23 100%);
            border-bottom: 1px solid #2a2d3a;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .top-banner h1 {
            font-weight: 800;
            background: -webkit-linear-gradient(45deg, var(--accent), var(--accent-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        /* Cards */
        .show-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 1px solid #2a2d3a;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .show-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            border-color: #3a3d4a;
        }

        /* Posters */
        .poster-img {
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease;
            max-height: 350px;
            object-fit: cover;
        }

        .show-card:hover .poster-img {
            transform: scale(1.03);
        }

        /* Buttons */
        .btn-warning {
            background: linear-gradient(45deg, #ff9900, #ff5500);
            border: none;
            color: white;
            font-weight: 600;
        }

        .btn-warning:hover {
            background: linear-gradient(45deg, #ff5500, #ff9900);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 85, 0, 0.4);
        }

        .btn-outline-info {
            border-color: var(--accent);
            color: var(--accent);
            transition: all 0.3s;
        }

        .btn-outline-info:hover {
            background-color: var(--accent);
            color: #000;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
        }

        .btn-outline-light {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-outline-light:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
        }

        /* Inputs & Selects */
        .form-control,
        .form-select {
            background-color: #22252e;
            border: 1px solid #3a3d4a;
            color: var(--text-main) !important;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: #2a2d3a;
            color: white;
            border-color: var(--accent);
            box-shadow: 0 0 0 0.25rem rgba(0, 210, 255, 0.25);
        }

        .form-select option {
            background-color: #22252e;
            color: white;
        }

        /* Texts */
        .text-muted {
            color: var(--text-muted) !important;
        }

        hr {
            border-color: #3a3d4a;
        }

        /* Drawer */
        .offcanvas {
            background-color: var(--card-bg) !important;
            border-left: 1px solid #2a2d3a;
        }

        .offcanvas-header {
            border-bottom: 1px solid #2a2d3a !important;
        }

        .offcanvas .card {
            background-color: #22252e !important;
            border: 1px solid #3a3d4a !important;
            transition: transform 0.2s;
        }

        .offcanvas .card:hover {
            transform: scale(1.02);
            border-color: var(--accent) !important;
        }

        .badge.bg-primary {
            background-color: var(--accent-glow) !important;
        }

        .badge.bg-warning {
            background-color: #ff9900 !important;
            color: #0f1014 !important;
        }
    </style>
</head>

<body>

    <div class="container-fluid p-5 top-banner text-white text-center">
        <h1>TV-SERIES</h1>
        <p>Zahiruddin <br>❤️<br> Nur Ain <br>( Telah meninggal dunia pada 11 Jan 2025, Al-Fatihah )</p>

        <div class="mt-4 d-flex flex-wrap justify-content-center gap-2">
            <a href="movie3.html" class="btn btn-primary"><i class="fas fa-film"></i> Movies</a>
            <a href="movie4.html" class="btn btn-warning"><i class="fas fa-tv"></i> TV Series</a>
            <button class="btn btn-outline-light" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#wishlistDrawer" aria-controls="wishlistDrawer">
                <i class="fas fa-heart text-danger"></i> Wishlist (<span id="wishlist-count">0</span>)
            </button>
        </div>
    </div>

    <div class="container mt-5">
        <div class="row">
            <div class="col-sm-2"></div>
            <div class="col-sm-8">
                <div class="input-group mb-3">
                    <input type="text" class="form-control" style="border: 2px solid #6c757d; "
                        placeholder="Search TV Series" id="id_q">
                    <button class="btn btn-success" type="submit" id="id_btn_search">Go</button>
                </div>

                <div id="id_loop">

                </div>

                <button class="btn btn-sm btn-primary mb-3" id="next">Next</button>

            </div>


            <div class="col-sm-2">
            </div>
        </div>
    </div>
    </div>

    <script>
        $(document).ready(function () {
            let token = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiI4MjQ0OTg5MjQyZjc2OTdjNmNiNWVkMWRjYmRmYTc3NyIsInN1YiI6IjY1MTI0YjNmMjZkYWMxMDEwYzc2ZDAxMSIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.f7DGzYIUKyedUhmhe87tVuDGMqLYP4B3xkQ197-U-z8';

            function renderSeries(results, pageNumber) {
                for (var i = 0; i < results.length; i++) {
                    let show = results[i];
                    let id = show['id'];
                    let title = show['name'];
                    let release_date = show['first_air_date'];
                    let img = show['poster_path'];
                    let overview = show['overview'];
                    let vote = show['vote_average'];
                    let imgSrc = img ? "http://image.tmdb.org/t/p/w200" + img : "https://placehold.co/200x300/1a1c23/a0a0a0.png?text=No+Image";

                    // Sediakan container kosong supaya urutan siri tetap terjaga sementara menunggu API
                    $("#id_loop").append(`<div id="show_container_${id}"><div class="text-muted my-3 text-center"><small><i class="fas fa-spinner fa-spin"></i> Menyemak Musim & Episod ${title}...</small></div></div>`);


                    // Panggil API spesifik untuk dapatkan jumlah Season & Episode
                    axios.get('https://api.themoviedb.org/3/tv/' + id, {
                        headers: { Authorization: `Bearer ${token}` }
                    }).then(function (detailRes) {
                        let details = detailRes.data;

                        // Biasanya season_number 0 adalah 'Specials', jadi kita tapis > 0
                        let seasons = details.seasons.filter(s => s.season_number > 0);

                        let seasonOptions = '';
                        if (seasons.length === 0) {
                            seasonOptions = `<option value="1" data-episodes="1">Season 1</option>`;
                        } else {
                            seasons.forEach(s => {
                                let epCount = s.episode_count || 1; // jika 0, letak minimum 1
                                seasonOptions += `<option value="${s.season_number}" data-episodes="${epCount}">Season ${s.season_number}</option>`;
                            });
                        }

                        // Senaraikan episod berdasarkan musim pertama dalam senarai
                        let initialEpisodes = seasons.length > 0 ? (seasons[0].episode_count || 1) : 1;
                        let episodeOptions = '';
                        for (let e = 1; e <= initialEpisodes; e++) {
                            episodeOptions += `<option value="${e}">Episode ${e}</option>`;
                        }

                        let html = `
                <div class="row show-card align-items-center">
                    <div class="col-sm-4 text-center">
                        <img src="${imgSrc}" class="poster-img img-fluid" onerror="this.onerror=null; this.src='https://placehold.co/200x300/1a1c23/a0a0a0.png?text=No+Image'">
                    </div>
                    <div class="col-sm-8 mt-4 mt-sm-0">
                        <span id='id_title_long' class='h4 fw-bold'>${title}</span><br><br>

                        <div id="id_all_genre">
                            <div class="row g-2 mb-3 mt-2" style="max-width: 400px;">
                                <div class="col-6">
                                    <select class="form-select form-select-sm season-dropdown" id="season_${id}" data-id="${id}">
                                        ${seasonOptions}
                                    </select>
                                </div>
                                <div class="col-6">
                                    <select class="form-select form-select-sm episode-dropdown" id="episode_${id}">
                                        ${episodeOptions}
                                    </select>
                                </div>
                                <div class="col-12 mt-2">
                                    <button class="btn btn-warning btn-sm w-100" onclick="window.open('https://vidsrcme.su/embed/tv/${id}/' + $('#season_${id}').val() + '/' + $('#episode_${id}').val(), '_blank')"><i class="fas fa-play"></i> Watch</button>
                                </div>
                                <div class="col-12 mt-2">
                                    <button class="btn btn-outline-info btn-sm w-100" onclick="addToWishlist('tv', ${id}, decodeURIComponent('${encodeURIComponent(title).replace(/'/g, '%27')}'), $('#season_${id}').val(), $('#episode_${id}').val())"><i class="fas fa-heart"></i> Add to Wishlist</button>
                                </div>
                            </div>
                        </div>
                        <span id='id_rating' class="text-muted"><i class="far fa-calendar-alt"></i> First Aired: <b>${release_date || 'N/A'}</b></span><br>
                        <span class="badge bg-warning text-dark my-2"><i class="fas fa-star"></i> ${vote}</span><br>

                        <span id='id_summary' class="text-muted" style="line-height: 1.6;">${overview}</span><br><br>
                        <small class="text-secondary">page: ${pageNumber}</small>
                    </div>
                </div>
                `;
                        $(`#show_container_${id}`).html(html);
                    }).catch(function (err) {
                        $(`#show_container_${id}`).html(`<div class="text-danger py-3">Gagal memuatkan butiran untuk siri ini.</div>`);
                    });
                }
            }

            // Apabila pengguna menukar Musim, kemas kini bilangan episod
            $(document).on('change', '.season-dropdown', function () {
                let id = $(this).data('id');
                let episodesCount = $(this).find(':selected').data('episodes');
                let epSelect = $(`#episode_${id}`);

                epSelect.empty();
                if (episodesCount === 0) episodesCount = 1; // Fallback
                for (let e = 1; e <= episodesCount; e++) {
                    epSelect.append(`<option value="${e}">Episode ${e}</option>`);
                }
            });

            // load tv series
            function load_tv(page) {
                $("#id_loop").html('<div class="text-center py-5"><i class="fas fa-spinner fa-spin fa-2x"></i></div>');
                axios.get('https://api.themoviedb.org/3/tv/popular?page=' + page, {
                    headers: { Authorization: `Bearer ${token}` }
                }).then(function (response) {
                    $("#id_loop").html(''); // Clear loading
                    renderSeries(response.data.results, response.data.page);
                }).catch(function (error) {
                    console.log(error);
                });
            }

            // search tv series
            function search(q) {
                $("#id_loop").html('<div class="text-center py-5"><i class="fas fa-spinner fa-spin fa-2x"></i></div>');
                axios.get('https://api.themoviedb.org/3/search/tv?query=' + q, {
                    headers: { Authorization: `Bearer ${token}` }
                }).then(function (response) {
                    $("#id_loop").html(''); // Clear loading
                    renderSeries(response.data.results, response.data.page);
                }).catch(function (error) {
                    console.log(error);
                });
            }

            load_tv(1);
            let num = 1;

            $('#next').click(function () {
                num = num + 1;
                load_tv(num);
                $('#next').show();
            });

            $('#id_btn_search').click(function () {
                var getq = $('#id_q').val();
                if (getq.trim() !== '') {
                    search(getq);
                    $('#next').hide();
                }
            });

        });
    </script>



    <!-- Offcanvas Wishlist -->
    <div class="offcanvas offcanvas-end bg-dark text-light" tabindex="-1" id="wishlistDrawer"
        aria-labelledby="wishlistDrawerLabel">
        <div class="offcanvas-header border-bottom border-secondary">
            <h5 class="offcanvas-title" id="wishlistDrawerLabel"><i class="fas fa-heart text-danger"></i> My Wishlist
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <div id="wishlist-items">
                <!-- Items will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        // Wishlist Logic
        function loadWishlist() {
            let list = JSON.parse(localStorage.getItem('myWishlist')) || [];
            $('#wishlist-count').text(list.length);
            let html = '';
            if (list.length === 0) {
                html = '<p class="text-muted">Wishlist kosong.</p>';
            } else {
                list.forEach((item, index) => {
                    let badge = item.type === 'movie' ? '<span class="badge bg-primary">Movie</span>' : '<span class="badge bg-warning text-dark">TV</span>';
                    let subtitle = item.type === 'tv' ? `<small class="d-block text-info">Season ${item.season}, Episode ${item.episode}</small>` : '';
                    html += `
            <div class="card bg-secondary text-light mb-2 border-0 shadow-sm">
                <div class="card-body p-2 d-flex justify-content-between align-items-center">
                    <div style="cursor:pointer; flex-grow:1;" onclick="window.open('${item.url}', '_blank')">
                        <div class="fw-bold fs-6">${item.title} ${badge}</div>
                        ${subtitle}
                    </div>
                    <button class="btn btn-sm btn-danger ms-2" onclick="removeFromWishlist(${index})"><i class="fas fa-trash"></i></button>
                </div>
            </div>`;
                });
            }
            $('#wishlist-items').html(html);
        }

        function addToWishlist(type, id, title, season = null, episode = null) {
            let list = JSON.parse(localStorage.getItem('myWishlist')) || [];
            let url = type === 'movie' ? `https://vidsrcme.su/embed/movie/${id}` : `https://vidsrcme.su/embed/tv/${id}/${season}/${episode}`;

            // Check if exists
            let exists = list.find(i => i.url === url);
            if (exists) {
                alert("Pilihan ini sudah ada di dalam wishlist!");
                return;
            }

            list.push({ type, id, title, season, episode, url });
            localStorage.setItem('myWishlist', JSON.stringify(list));
            loadWishlist();

            // Open drawer
            let offcanvas = new bootstrap.Offcanvas(document.getElementById('wishlistDrawer'));
            offcanvas.show();
        }

        function removeFromWishlist(index) {
            let list = JSON.parse(localStorage.getItem('myWishlist')) || [];
            list.splice(index, 1);
            localStorage.setItem('myWishlist', JSON.stringify(list));
            loadWishlist();
        }

        $(document).ready(function () {
            loadWishlist();
        });
    </script>

</body>

</html>
